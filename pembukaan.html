<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8bd78">
    <title>Pembukaan - Mitigasi Erupsi Gunung Semeru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pembukaan.css">
</head>
<body>
    <main class="opening-screen">
        <div class="opening-glow opening-glow-left" aria-hidden="true"></div>
        <div class="opening-glow opening-glow-right" aria-hidden="true"></div>

        <section class="opening-layout" aria-labelledby="openingTitle">
            <div class="opening-copy">
                <h1 id="openingTitle">Mitigasi Erupsi<br>Gunung Semeru</h1>
                <div class="opening-caption" aria-live="polite" aria-atomic="true">
                    <p id="openingCaption"></p>
                </div>
                <!-- Touchless Gesture Trigger Pill -->
                <div class="opening-gesture-pill" id="openingGesturePill">
                    <div class="gesture-pill-ring">
                        <svg class="ring-svg" viewBox="0 0 36 36">
                            <circle class="ring-bg" cx="18" cy="18" r="14"/>
                            <circle class="ring-fill" id="openingRingFill" cx="18" cy="18" r="14"/>
                        </svg>
                        <svg class="gesture-pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 9V5a2 2 0 0 0-4 0v4"/>
                            <path d="M10 5V3a2 2 0 0 1 4 0v2"/>
                            <path d="M18 11V8a2 2 0 0 0-4 0v3"/>
                            <path d="M10 10.5V14a4 4 0 0 0 8 0v-3"/>
                        </svg>
                    </div>
                    <span class="gesture-pill-text" id="openingGestureText">Angkat 2 Jari atau Klik Maskot</span>
                </div>
            </div>

            <div class="opening-mascot">
                <div class="mascot-halo" aria-hidden="true"></div>
                <button
                    class="mascot-trigger"
                    id="mascotTrigger"
                    type="button"
                    aria-label="Klik maskot untuk memulai narasi pembukaan"
                    aria-pressed="false"
                >
                    <img
                        class="mascot-image mascot-image-idle"
                        src="assets/Gambar/maskot%201.png"
                        alt="Maskot menyapa"
                    >
                    <img
                        class="mascot-image mascot-image-ready"
                        src="assets/Gambar/maskot%202.png"
                        alt=""
                        aria-hidden="true"
                    >
                </button>
            </div>
        </section>

        <audio id="openingAudio" preload="auto" aria-hidden="true">
            <source src="assets/Audio/01.%20VO_01_Pembukaan.mp3" type="audio/mpeg">
        </audio>
        <video id="openingWebcam" autoplay muted playsinline style="display: none;"></video>
    </main>
    <script type="module" src="pembukaan.js"></script>
</body>
</html>
